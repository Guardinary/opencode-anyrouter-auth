name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run portable offline regression suite
        run: pnpm test
      - name: Check metadata and runtime import graph
        run: pnpm run check:package
      - name: Pack private-file fixture and import the actual archive offline
        run: pnpm run check:pack

  bun:
    name: Bun (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run offline Bun regressions
        run: bun test --isolate --max-concurrency=1 test/

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [test, bun]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all matrix jobs to pass
        env:
          NODE_RESULT: ${{ needs.test.result }}
          BUN_RESULT: ${{ needs.bun.result }}
        run: test "$NODE_RESULT" = success && test "$BUN_RESULT" = success
